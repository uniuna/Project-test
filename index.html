<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Untitled Document</title>
    <style>
        :root { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; color-scheme: light dark; }
        body { margin: 0; padding: 1.5rem; max-width: 900px; margin-inline: auto; line-height: 1.5; }
        header, footer { padding: .5rem 0; }
        header h1 { margin: 0 0 .25rem 0; font-size: 1.25rem; }
        nav a { margin-right: .75rem; color: #0366d6; text-decoration: none; }
        main { padding-top: .75rem; }
        .card { border: 1px solid rgba(0,0,0,.08); border-radius: 8px; padding: 1rem; background: rgba(0,0,0,.02); }
        @media (prefers-color-scheme: dark) {
            body { background: #0b1020; color: #e6eef8; }
            .card { background: rgba(255,255,255,.02); border-color: rgba(255,255,255,.06); }
            nav a { color: #7fb4ff; }
        }
    </style>
</head>
<body>
    <header>
        <h1>測試</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <section class="card" id="app">
            <h2>Getting started</h2>
            <p>This is a minimal HTML starter. Replace this content with your app markup.</p>
            <button id="action">Click me</button>
        </section>
    </main>

    <footer>
        <small>Created on <!-- timestamp populated by script --></small>
    </footer>

    <script>
        document.getElementById('action').addEventListener('click', () => {
            const el = document.getElementById('app');
            const p = document.createElement('p');
            p.textContent = 'Button clicked — add your behavior here.';
            el.appendChild(p);
        });
        document.querySelector('footer small').textContent = 'Created on ' + new Date().toLocaleString();
    </script>
</body>
</html>
